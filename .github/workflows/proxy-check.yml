name: proxy-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          T="https://www.instagram.com/p/DePQnsXEq7-/embed/captioned/"
          E=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$T")
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          t() { curl -s -m 40 -A "$UA" -H "Origin: https://wualtervera.github.io" -H "Referer: https://wualtervera.github.io/" "${@:2}" -D h.txt -o b.txt "$1"; echo "RES $1 => $(head -1 h.txt | tr -d '\r') len=$(wc -c < b.txt) media=$(grep -c EmbeddedMediaImage b.txt) disp=$(grep -o display_url b.txt | wc -l) acao=$(grep -i access-control-allow-origin h.txt | tr -d '\r') body=$(head -c 160 b.txt | tr '\n' ' ')"; }
          t "https://corsproxy.io/?url=$E"
          t "https://api.allorigins.win/get?url=$E"
          t "https://r.jina.ai/$T" -H "X-Return-Format: html"
          t "https://everyorigin.jwvbremen.nl/api/get?url=$E"
          t "https://whateverorigin.org/get?url=$E"
          t "https://cors.eu.org/$T"
          t "https://proxy.corsfix.com/?$T"
          t "https://corsproxy.org/?$E"
          t "https://test.cors.workers.dev/?$T"
